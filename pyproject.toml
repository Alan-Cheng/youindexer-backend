[project]
name = "youindexer-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "pre-commit>=4.6.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
