services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youindexer}
      POSTGRES_USER: ${POSTGRES_USER:-youindexer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youindexer}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youindexer} -d ${POSTGRES_DB:-youindexer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  transcription-worker:
    build:
      context: .
    cpus: ${TRANSCRIPTION_WORKER_CPUS:-0.5}
    mem_limit: ${TRANSCRIPTION_WORKER_MEMORY_LIMIT:-512m}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-youindexer}:${POSTGRES_PASSWORD:-youindexer}@postgres:5432/${POSTGRES_DB:-youindexer}
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-youindexer}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  index-worker:
    build:
      context: .
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--queues=indexing,outbox", "--loglevel=INFO", "--concurrency=2"]
    cpus: ${INDEX_WORKER_CPUS:-0.5}
    mem_limit: ${INDEX_WORKER_MEMORY_LIMIT:-512m}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-youindexer}:${POSTGRES_PASSWORD:-youindexer}@postgres:5432/${POSTGRES_DB:-youindexer}
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-youindexer}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_SUBTITLE_INDEX: ${OPENSEARCH_SUBTITLE_INDEX:-subtitle-segments-v1}
      OPENSEARCH_SUBTITLE_ALIAS: ${OPENSEARCH_SUBTITLE_ALIAS:-subtitle-segments}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    cpus: ${CELERY_BEAT_CPUS:-0.25}
    mem_limit: ${CELERY_BEAT_MEMORY_LIMIT:-256m}
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    cpus: ${OPENSEARCH_CPUS:-1.0}
    mem_limit: ${OPENSEARCH_MEMORY_LIMIT:-1g}
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_ANALYZER_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    cpus: ${OPENSEARCH_DASHBOARDS_CPUS:-0.5}
    mem_limit: ${OPENSEARCH_DASHBOARDS_MEMORY_LIMIT:-512m}
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: ${OPENSEARCH_DASHBOARDS_NODE_OPTIONS:---max-old-space-size=256}
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_storage:
  opensearch_data:
